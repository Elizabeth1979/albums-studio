# Local development configuration. Keep the database major version aligned with production.
project_id = "albums-studio"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[storage]
enabled = true
file_size_limit = "5MiB"

[storage.buckets.photos]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp", "image/avif"]
