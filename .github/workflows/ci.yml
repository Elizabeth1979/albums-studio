name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Opening a pull request does not always produce a run: it silently failed to
  # on two consecutive attempts for the same branch while pushes to main kept
  # working. Without this there is no way to ask for the checks, and the choice
  # is between merging unverified and pushing a commit that exists only to
  # nudge GitHub.
  workflow_dispatch:

permissions:
  # Write, for the pictures in the accessibility comment, kept on the aee-images branch.
  contents: write
  # For the accessibility comment the end-to-end step keeps on each pull request.
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # The suite never reaches Supabase: unit tests mock the client and the
      # end-to-end suite intercepts every request in the browser. These exist
      # only so the client can be constructed at build time.
      VITE_SUPABASE_URL: https://stub.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: stub-publishable-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The suite runs as before, and every page its tests load is also checked for accessibility.
      # The findings go in one comment on the pull request; only a failing test fails the job.
      - name: End-to-end tests with accessibility checks
        uses: Elizabeth1979/accessibility-evidence-engine@v0.8.0
        with:
          run: npm run test:e2e
          fail-on: never
          # A picture of each problem in the comment.
          images: true

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
